name: tarif_defteri
description: "Tarif Defteri - Kişisel tarif koleksiyonunuzu oluşturun, düzenleyin ve favorilerinizi yönetin. Fotoğraflarla zenginleştirilmiş tariflerinizi organize edin."
publish_to: 'none'
version: 1.0.9+24

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  url_launcher: ^6.2.5
  provider: ^6.1.1
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_quill: ^11.4.1
  flutter_quill_extensions: ^11.0.0
  showcaseview: ^4.0.1
  package_info_plus: ^8.0.0
  google_mobile_ads: ^6.0.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  # google_sign_in: ^6.2.1  # Geçici olarak kaldırıldı - pod dependency conflict
  google_fonts: ^6.1.0
  easy_localization: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  image: assets/logo.png
  color: "#FFFFFF"
  image_dark: assets/logo.png
  color_dark: "#000000"
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/lang/